name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  id-token: write
  checks: write

jobs:
  authorize:
    name: Authorize caller
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    permissions:
      contents: read
    outputs:
      allowed: ${{ steps.permission.outputs.allowed }}
    steps:
      - name: Verify repository write permission
        id: permission
        env:
          ACTOR: ${{ github.actor }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$ACTOR" in
            "blacksmith-sh[bot]"|"useotto[bot]"|"useotto-dev[bot]")
              allowed=true
              ;;
            *)
              if permission="$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$ACTOR/permission" --jq '.permission' 2>/dev/null)"; then
                case "$permission" in
                  admin|write) allowed=true ;;
                  *) allowed=false ;;
                esac
              else
                allowed=false
              fi
              ;;
          esac
          echo "allowed=$allowed" >> "$GITHUB_OUTPUT"

  claude:
    needs: authorize
    # Bot comments are allowed through; the reusable workflow's allowed_bots
    # list decides which bots may actually trigger a run.
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (
        github.event_name != 'issue_comment' ||
        (
          github.event.comment.body != '/review' &&
          !startsWith(github.event.comment.body, '/review ')
        )
      )
    uses: ./.github/workflows/claude-agent-reusable.yml
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

  code-review:
    name: Manual Code Review
    needs: authorize
    if: |
      needs.authorize.outputs.allowed == 'true' &&
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        (
          github.event.comment.body == '/review' ||
          startsWith(github.event.comment.body, '/review ')
        )
      )
    uses: ./.github/workflows/claude-code-review-reusable.yml
    secrets:
      claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
