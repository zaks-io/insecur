# Vendored from zaks-io/claude-code-action at 3c9d5703b1d7ed27fdd5a0b89ec494bf7ea2af55.
# Keep every nested action pinned before updating this copy.
name: Claude Code Reusable

on:
  workflow_call:
    inputs:
      allowed_tools:
        description: "Comma-separated list of allowed tools for Claude"
        type: string
        required: false
        default: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*)"
      prompt:
        description: "Custom prompt to append to the default behavior"
        type: string
        required: false
        default: ""
    secrets:
      claude_code_oauth_token:
        description: "Claude Code OAuth token"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@536f2c32a39763739000b0e1ac69ca2647d97ce9 # v1.0.170
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "blacksmith-sh,useotto[bot],useotto-dev[bot]"
          track_progress: true
          claude_args: "--allowedTools '${{ inputs.allowed_tools }}'"
          prompt: ${{ inputs.prompt }}
          additional_permissions: |
            actions: read
