# Vendored from zaks-io/claude-code-action at 3c9d5703b1d7ed27fdd5a0b89ec494bf7ea2af55.
# Keep every nested action pinned before updating this copy.
name: Claude Code Reusable

on:
  workflow_call:
    inputs:
      allowed_tools:
        description: "Comma-separated list of allowed tools for Claude"
        type: string
        required: false
        default: "Edit,MultiEdit,Write,Read,Glob,Grep,LS,Bash(git:*),Bash(bun:*),Bash(npm:*),Bash(npx:*),Bash(gh:*)"
      prompt:
        description: "Custom prompt to append to the default behavior"
        type: string
        required: false
        default: ""
    secrets:
      claude_code_oauth_token:
        description: "Claude Code OAuth token"
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: read

jobs:
  claude:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Run Claude Code
        uses: anthropics/claude-code-action@ed670b4cf9de2a5a570d130d2f6197b9e543cd64 # v1.0.240
        with:
          claude_code_oauth_token: ${{ secrets.claude_code_oauth_token }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          allowed_bots: "blacksmith-sh,useotto[bot],useotto-dev[bot]"
          track_progress: true
          claude_args: "--allowedTools '${{ inputs.allowed_tools }}'"
          prompt: ${{ inputs.prompt }}
          additional_permissions: |
            actions: read
