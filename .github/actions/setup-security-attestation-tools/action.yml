name: Setup security attestation tools
description: Install the scanner CLIs used by pnpm security:attest.
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"

    - name: Resolve tool versions
      id: tools
      shell: bash
      env:
        GITLEAKS_VERSION: 8.30.1
        TRIVY_VERSION: 0.75.0
        SYFT_VERSION: 1.54.0
        GRYPE_VERSION: 0.120.0
      run: |
        set -euo pipefail
        {
          echo "gitleaks=$GITLEAKS_VERSION"
          echo "trivy=$TRIVY_VERSION"
          echo "syft=$SYFT_VERSION"
          echo "grype=$GRYPE_VERSION"
        } >> "$GITHUB_OUTPUT"

    - name: Install binary scanner CLIs
      shell: bash
      env:
        GITLEAKS_VERSION: ${{ steps.tools.outputs.gitleaks }}
        GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        TRIVY_VERSION: ${{ steps.tools.outputs.trivy }}
        TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        SYFT_VERSION: ${{ steps.tools.outputs.syft }}
        SYFT_SHA256: 54a87372498168b2d033e876fd41fa4e8035b872699e525a57046e1f2f09c860
        GRYPE_VERSION: ${{ steps.tools.outputs.grype }}
        GRYPE_SHA256: a5a1218dce63acdac152a6b3b5bb366e7267e36f4069848cf455543b3fa5700e
      run: |
        set -euo pipefail
        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT
        bin_dir="$RUNNER_TEMP/security-attestation-tools/bin"
        mkdir -p "$bin_dir"

        install_release_tar() {
          local binary="$1"
          local repo="$2"
          local tag="$3"
          local asset="$4"
          local checksum="$5"
          local archive="$tmp_dir/$asset"
          local extract_dir="$tmp_dir/$binary"
          local binary_path

          curl --fail --silent --show-error --location \
            "https://github.com/${repo}/releases/download/${tag}/${asset}" \
            --output "$archive"
          (cd "$tmp_dir" && printf '%s  %s\n' "$checksum" "$asset" | sha256sum --check --strict -)

          mkdir -p "$extract_dir"
          tar -xzf "$archive" -C "$extract_dir"
          binary_path="$(find "$extract_dir" -type f -name "$binary" | head -n 1)"
          if [ -z "$binary_path" ]; then
            echo "::error::Missing ${binary} binary in ${asset}"
            exit 1
          fi
          install -m 0755 "$binary_path" "$bin_dir/$binary"
        }

        install_release_tar \
          gitleaks \
          gitleaks/gitleaks \
          "v${GITLEAKS_VERSION}" \
          "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
          "$GITLEAKS_SHA256"
        install_release_tar \
          trivy \
          aquasecurity/trivy \
          "v${TRIVY_VERSION}" \
          "trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz" \
          "$TRIVY_SHA256"
        install_release_tar \
          syft \
          anchore/syft \
          "v${SYFT_VERSION}" \
          "syft_${SYFT_VERSION}_linux_amd64.tar.gz" \
          "$SYFT_SHA256"
        install_release_tar \
          grype \
          anchore/grype \
          "v${GRYPE_VERSION}" \
          "grype_${GRYPE_VERSION}_linux_amd64.tar.gz" \
          "$GRYPE_SHA256"

    - name: Install Python scanner CLIs
      shell: bash
      env:
        REQUIREMENTS_FILE: ${{ github.action_path }}/requirements.txt
      run: |
        set -euo pipefail
        venv_dir="$RUNNER_TEMP/security-attestation-tools/venv"
        python -m venv "$venv_dir"
        "$venv_dir/bin/python" -m pip install \
          --disable-pip-version-check \
          --only-binary=:all: \
          --require-hashes \
          --requirement "$REQUIREMENTS_FILE"

    - name: Add scanner CLIs to PATH
      shell: bash
      run: |
        set -euo pipefail
        echo "$RUNNER_TEMP/security-attestation-tools/bin" >> "$GITHUB_PATH"
        echo "$RUNNER_TEMP/security-attestation-tools/venv/bin" >> "$GITHUB_PATH"

    - name: Restore scanner database cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cache/trivy
          ~/.cache/grype
        key: ${{ runner.os }}-scanner-dbs-${{ github.run_id }}
        restore-keys: |
          ${{ runner.os }}-scanner-dbs-

    - name: Show scanner versions
      shell: bash
      run: |
        set -euo pipefail
        gitleaks version
        trivy --version
        syft version
        grype version
        checkov --version
        semgrep --version
