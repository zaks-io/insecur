# Gitleaks config for insecur CI and local hooks.
# Rule-specific allowlists use path+line AND conditions; default rules stay enabled.
title = "insecur gitleaks"

[extend]
useDefault = true

[[allowlists]]
description = "Generated local build/test output that is gitignored and never committed"
paths = [
  '''(?i)^reports/mutation/''',
  '''(?i)^\.stryker-tmp/''',
  '''(?i)^stryker\.log$''',
  '''(?i)(^|/)\.turbo/''',
]

[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Branded secret opaque id fixtures in package unit tests (metadata ids, not secret values)"
condition = "and"
paths = ['''(?i)^packages/.+\.test\.ts$''']
regexes = ['''^sec_[0-9A-Z]{26}$''']

[[rules.allowlists]]
description = "Linear tracker UUID false positives in workflow agent config (secret must be UUID only)"
condition = "and"
paths = ['''(?i)^docs/agents/workflow/config\.md$''']
regexes = [
  '''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''',
]

[[rules.allowlists]]
description = "Supply-chain toolchain prose in project documentation"
condition = "and"
paths = [
  '''(?i)^docs/production-mvp-acceptance\.md$''',
  '''(?i)^docs/project-status\.md$''',
  '''(?i)^docs/build-tooling\.md$''',
]
regexes = [
  '''^gitleaks/semgrep/syft/grype$''',
  '''^SBOM/vulnerability$''',
]

[[rules.allowlists]]
description = "SBOM token false positive in supply-chain project docs only"
condition = "and"
paths = [
  '''(?i)^docs/production-mvp-acceptance\.md$''',
  '''(?i)^docs/project-status\.md$''',
  '''(?i)^docs/build-tooling\.md$''',
]
stopwords = ["SBOM"]

[[rules.allowlists]]
description = "Historical scaffold JSON example in setup doc"
condition = "and"
paths = ['''(?i)^docs/setup\.md$''']
regexes = ['''^sk_live_abc123$''']

[[rules.allowlists]]
description = "Root-key BINDING NAME (not a secret value) asserted by the deploy-topology conformance gate"
condition = "and"
paths = ['''(?i)^scripts/ci/deploy-topology-conformance\.mjs$''']
regexes = ['''^INSTANCE_ROOT_KEY_V1$''']

[[rules.allowlists]]
description = "INSTANCE_ROOT_KEY_V1 binding-name literal in the content-only deploy assertion (a binding name, not a secret value)"
condition = "and"
paths = ['''(?i)^apps/runtime/scripts/deploy-content-only-lib\.mjs$''']
regexes = ['''INSTANCE_ROOT_KEY_V1''']

[[rules.allowlists]]
description = "Branded opaque secret-id fixtures in worker-kit route parsing unit tests"
condition = "and"
paths = ['''(?i)^packages/worker-kit/src/http/parse-route-input\.test\.ts$''']
regexes = ['''^sec_[0-9A-Z]{26}$''']

[[rules]]
id = "curl-auth-header"

[[rules.allowlists]]
# History only. The probe script's fixture is split across source lines today, so the
# working-tree scan never matches it, but at b65cb37f the fixture was a single-line base64
# blob that gitleaks decodes and flags. b65cb37f is an ancestor of main, so `gitleaks git`
# in security-daily hits it on every run. Pinned to the exact fake token rather than
# allowlisting the whole file for this rule.
description = "Intentional fake bearer token in gitleaks setup-doc regression probe"
condition = "and"
paths = ['''(?i)^scripts/ci/gitleaks-setup-doc-probe\.sh$''']
regexes = [
  '''^ins_live_supersecrettoken1234567890$''',
]

[[rules.allowlists]]
description = "Historical scaffold curl Bearer placeholder in setup doc"
condition = "and"
paths = ['''(?i)^docs/setup\.md$''']
regexes = [
  '''^ins_live_\.\.\.$''',
]
